name: Build Android Python Wheels

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag to publish wheels to'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to publish wheels to'
        required: true
        default: 'android-wheels-latest'
        type: string

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WHEELS_DIR: ${{ github.workspace }}/wheels
      # Bump the trailing -vN when you change build config (versions, flags, etc.)
      CACHE_KEY: android-wheels-Linux-jiter-0.14.0-pydantic-core-2.33.2-cp313-v1

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # 1. Restore previously built wheels from cache.
      # On a hit, the wheels/ directory is populated and builds are skipped.
      # On a miss, the directory is empty and builds run.
      # Cache is auto-saved at job end only on miss + success.
      # ──────────────────────────────────────────────────────────────────────
      - name: Restore wheels cache
        uses: actions/cache@v4
        id: wheels-cache
        with:
          path: ${{ env.WHEELS_DIR }}
          key: ${{ env.CACHE_KEY }}

      # ──────────────────────────────────────────────────────────────────────
      # 2. Verify all four required wheels exist.
      # Sets all_present=true if cache hit is usable, false otherwise.
      # ──────────────────────────────────────────────────────────────────────
      - name: Check cached wheels completeness
        id: check-wheels
        run: |
          required=(
            "pydantic_core-2.33.2-cp313-cp313-android_arm64_v8a.whl"
            "pydantic_core-2.33.2-cp313-cp313-android_x86_64.whl"
            "jiter-0.14.0-cp313-cp313-android_arm64_v8a.whl"
            "jiter-0.14.0-cp313-cp313-android_x86_64.whl"
          )

          all_present=true
          for whl in "${required[@]}"; do
            if [ ! -f "${{ env.WHEELS_DIR }}/$whl" ]; then
              echo "  ❌ Missing: $whl"
              all_present=false
            else
              echo "  ✅ Found: $whl"
            fi
          done

          if [ "$all_present" = true ]; then
            echo "all_present=true" >> "$GITHUB_OUTPUT"
            echo "✅ All wheels cached — skipping builds"
          else
            echo "all_present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Wheels incomplete — will build"
          fi

      # ──────────────────────────────────────────────────────────────────────
      # 3. Restore cibuildwheel internal cache (~/.cache/cibuildwheel).
      # This holds downloaded Python standalone builds, NDK tooling, etc.
      # Always restore it — speeds up builds even when wheels are missing.
      # ──────────────────────────────────────────────────────────────────────
      - name: Restore cibuildwheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/cibuildwheel
          key: cibuildwheel-tooling-${{ runner.os }}-${{ env.CACHE_KEY }}

      # ──────────────────────────────────────────────────────────────────────
      # 4. Checkout sources — only when wheels need building.
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout jiter source
        if: steps.check-wheels.outputs.all_present != 'true'
        uses: actions/checkout@v4
        with:
          repository: pydantic/jiter
          ref: v0.14.0
          path: jiter

      - name: Checkout pydantic-core source
        if: steps.check-wheels.outputs.all_present != 'true'
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic-core
          ref: v2.33.2
          path: pydantic-core

      # ──────────────────────────────────────────────────────────────────────
      # 5. Set up build tooling — only when wheels need building.
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up Python 3.13
        if: steps.check-wheels.outputs.all_present != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        if: steps.check-wheels.outputs.all_present != 'true'
        run: pip install cibuildwheel

      # ──────────────────────────────────────────────────────────────────────
      # 6. Build jiter — only when wheels need building.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build jiter for Android
        if: steps.check-wheels.outputs.all_present != 'true'
        working-directory: jiter/crates/jiter-python
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
        run: |
          mkdir -p "${{ env.WHEELS_DIR }}"
          cibuildwheel --output-dir "${{ env.WHEELS_DIR }}"

      - name: Verify jiter wheels built
        if: steps.check-wheels.outputs.all_present != 'true'
        run: |
          echo "✅ Jiter wheels:"
          ls -la "${{ env.WHEELS_DIR }}/"

      # ──────────────────────────────────────────────────────────────────────
      # 7. Build pydantic-core — only when wheels need building.
      # Uses absolute path to wheels dir so jiter is found inside cibuildwheel's
      # isolated build environment.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build pydantic-core for Android
        if: steps.check-wheels.outputs.all_present != 'true'
        working-directory: pydantic-core
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
          CIBW_BEFORE_BUILD: "pip install --no-index --find-links ${{ env.WHEELS_DIR }} jiter"
        run: |
          cibuildwheel --output-dir "${{ env.WHEELS_DIR }}"

      # ──────────────────────────────────────────────────────────────────────
      # 8. List final wheels — always runs for visibility.
      # ──────────────────────────────────────────────────────────────────────
      - name: List all wheels
        run: |
          echo "📦 Final wheels:"
          ls -la "${{ env.WHEELS_DIR }}/" || echo "Directory empty or missing"

      # ──────────────────────────────────────────────────────────────────────
      # 9. Upload artifact — always runs so the main workflow can download.
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-wheels
          path: ${{ env.WHEELS_DIR }}/*.whl

      # ──────────────────────────────────────────────────────────────────────
      # 10. Create/update GitHub Release — always runs so the main workflow
      # can download wheels via gh release download.
      # ──────────────────────────────────────────────────────────────────────
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          files: ${{ env.WHEELS_DIR }}/*.whl
          body: |
            Prebuilt Android wheels for pydantic-core and jiter.
            **Python:** 3.13 | **ABIs:** arm64-v8a, x86_64
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}