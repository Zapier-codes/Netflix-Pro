name: Build Android Python Wheels

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag to publish wheels to'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to publish wheels to'
        required: true
        default: 'android-wheels-latest'
        type: string

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WHEELS_DIR: ${{ github.workspace }}/wheels
      JITER_WHEELS_DIR: ${{ github.workspace }}/wheels/jiter
      PYDANTIC_CORE_WHEELS_DIR: ${{ github.workspace }}/wheels/pydantic-core
      # Each package gets its own cache key. Bump the trailing -vN for a
      # package only when that package's own build config changes (version,
      # flags, etc.) — bumping one no longer invalidates the other's cache.
      JITER_CACHE_KEY: android-wheels-jiter-Linux-0.14.0-cp313-v1
      PYDANTIC_CORE_CACHE_KEY: android-wheels-pydantic-core-Linux-2.33.2-jiter-0.14.0-cp313-v1

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # 1. Restore previously built wheels from cache — one entry per package.
      # On a hit, that package's directory is populated and its build is
      # skipped. On a miss, its directory is empty and its build runs.
      # Each cache is auto-saved at job end independently, only on miss + success.
      # ──────────────────────────────────────────────────────────────────────
      - name: Restore jiter wheels cache
        uses: actions/cache@v4
        id: jiter-cache
        with:
          path: ${{ env.JITER_WHEELS_DIR }}
          key: ${{ env.JITER_CACHE_KEY }}

      - name: Restore pydantic-core wheels cache
        uses: actions/cache@v4
        id: pydantic-core-cache
        with:
          path: ${{ env.PYDANTIC_CORE_WHEELS_DIR }}
          key: ${{ env.PYDANTIC_CORE_CACHE_KEY }}

      # ──────────────────────────────────────────────────────────────────────
      # 2. Verify each package's required wheels exist. Each check is
      # independent, so only the package that's actually missing gets rebuilt.
      # ──────────────────────────────────────────────────────────────────────
      - name: Check cached jiter wheels completeness
        id: check-jiter
        run: |
          required=(
            "jiter-0.14.0-cp313-cp313-android_arm64_v8a.whl"
            "jiter-0.14.0-cp313-cp313-android_x86_64.whl"
          )

          all_present=true
          for whl in "${required[@]}"; do
            if [ ! -f "${{ env.JITER_WHEELS_DIR }}/$whl" ]; then
              echo "  ❌ Missing: $whl"
              all_present=false
            else
              echo "  ✅ Found: $whl"
            fi
          done

          if [ "$all_present" = true ]; then
            echo "jiter_present=true" >> "$GITHUB_OUTPUT"
            echo "✅ jiter wheels cached — skipping build"
          else
            echo "jiter_present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  jiter wheels incomplete — will build"
          fi

      - name: Check cached pydantic-core wheels completeness
        id: check-pydantic-core
        run: |
          required=(
            "pydantic_core-2.33.2-cp313-cp313-android_arm64_v8a.whl"
            "pydantic_core-2.33.2-cp313-cp313-android_x86_64.whl"
          )

          all_present=true
          for whl in "${required[@]}"; do
            if [ ! -f "${{ env.PYDANTIC_CORE_WHEELS_DIR }}/$whl" ]; then
              echo "  ❌ Missing: $whl"
              all_present=false
            else
              echo "  ✅ Found: $whl"
            fi
          done

          if [ "$all_present" = true ]; then
            echo "pydantic_core_present=true" >> "$GITHUB_OUTPUT"
            echo "✅ pydantic-core wheels cached — skipping build"
          else
            echo "pydantic_core_present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  pydantic-core wheels incomplete — will build"
          fi

      # ──────────────────────────────────────────────────────────────────────
      # 3. Restore cibuildwheel internal cache (~/.cache/cibuildwheel).
      # This holds downloaded Python standalone builds, NDK tooling, etc.
      # Always restore it — speeds up builds even when wheels are missing.
      # ──────────────────────────────────────────────────────────────────────
      - name: Restore cibuildwheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/cibuildwheel
          key: cibuildwheel-tooling-Linux-${{ env.JITER_CACHE_KEY }}-${{ env.PYDANTIC_CORE_CACHE_KEY }}

      # ──────────────────────────────────────────────────────────────────────
      # 4. Checkout sources — only when that package's wheels need building.
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout jiter source
        if: steps.check-jiter.outputs.jiter_present != 'true'
        uses: actions/checkout@v4
        with:
          repository: pydantic/jiter
          ref: v0.14.0
          path: jiter

      - name: Checkout pydantic-core source
        if: steps.check-pydantic-core.outputs.pydantic_core_present != 'true'
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic-core
          ref: v2.33.2
          path: pydantic-core

      # ──────────────────────────────────────────────────────────────────────
      # 5. Set up build tooling — only when at least one package needs building.
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up Python 3.13
        if: steps.check-jiter.outputs.jiter_present != 'true' || steps.check-pydantic-core.outputs.pydantic_core_present != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        if: steps.check-jiter.outputs.jiter_present != 'true' || steps.check-pydantic-core.outputs.pydantic_core_present != 'true'
        run: pip install cibuildwheel

      # ──────────────────────────────────────────────────────────────────────
      # 6. Build jiter — only when jiter wheels need building.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build jiter for Android
        if: steps.check-jiter.outputs.jiter_present != 'true'
        working-directory: jiter/crates/jiter-python
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
        run: |
          mkdir -p "${{ env.JITER_WHEELS_DIR }}"
          cibuildwheel --output-dir "${{ env.JITER_WHEELS_DIR }}"

      - name: Verify jiter wheels built
        if: steps.check-jiter.outputs.jiter_present != 'true'
        run: |
          echo "✅ Jiter wheels:"
          ls -la "${{ env.JITER_WHEELS_DIR }}/"

      # ──────────────────────────────────────────────────────────────────────
      # 7. Build pydantic-core — only when pydantic-core wheels need building.
      # Uses absolute path to the jiter wheels dir so jiter is found inside
      # cibuildwheel's isolated build environment, whether it came from cache
      # or was just built above.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build pydantic-core for Android
        if: steps.check-pydantic-core.outputs.pydantic_core_present != 'true'
        working-directory: pydantic-core
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
          CIBW_BEFORE_BUILD: "pip install --no-index --find-links ${{ env.JITER_WHEELS_DIR }} jiter"
        run: |
          mkdir -p "${{ env.PYDANTIC_CORE_WHEELS_DIR }}"
          cibuildwheel --output-dir "${{ env.PYDANTIC_CORE_WHEELS_DIR }}"

      # ──────────────────────────────────────────────────────────────────────
      # 8. List final wheels — always runs for visibility.
      # ──────────────────────────────────────────────────────────────────────
      - name: List all wheels
        run: |
          echo "📦 Final wheels:"
          ls -la "${{ env.JITER_WHEELS_DIR }}/" || echo "jiter directory empty or missing"
          ls -la "${{ env.PYDANTIC_CORE_WHEELS_DIR }}/" || echo "pydantic-core directory empty or missing"

      # ──────────────────────────────────────────────────────────────────────
      # 9. Upload artifact — always runs so the main workflow can download.
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-wheels
          path: |
            ${{ env.JITER_WHEELS_DIR }}/*.whl
            ${{ env.PYDANTIC_CORE_WHEELS_DIR }}/*.whl
          retention-days: 1

      # ──────────────────────────────────────────────────────────────────────
      # 10. Create/update GitHub Release — always runs so the main workflow
      # can download wheels via gh release download.
      # ──────────────────────────────────────────────────────────────────────
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          files: |
            ${{ env.JITER_WHEELS_DIR }}/*.whl
            ${{ env.PYDANTIC_CORE_WHEELS_DIR }}/*.whl
          body: |
            Prebuilt Android wheels for pydantic-core and jiter.
            **Python:** 3.13 | **ABIs:** arm64-v8a, x86_64
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}