name: Build Android Python Wheels

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag to publish wheels to'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to publish wheels to'
        required: true
        default: 'android-wheels-latest'
        type: string

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jiter source
        uses: actions/checkout@v4
        with:
          repository: pydantic/jiter
          ref: v0.14.0
          path: jiter

      - name: Checkout pydantic-core source
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic-core
          ref: v2.33.2
          path: pydantic-core

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      # ──────────────────────────────────────────────────────────────────────
      # Build jiter FIRST — pydantic-core needs it as a build dependency.
      # Output to an absolute path that we can reference later.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build jiter for Android
        working-directory: jiter/crates/jiter-python
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
        run: |
          mkdir -p "${{ github.workspace }}/wheels"
          cibuildwheel --output-dir "${{ github.workspace }}/wheels"

      - name: Verify jiter wheels built
        run: |
          echo "✅ Jiter wheels:"
          ls -la "${{ github.workspace }}/wheels/"

      # ──────────────────────────────────────────────────────────────────────
      # Build pydantic-core SECOND — install jiter from the absolute wheels
      # directory before building. CIBW_BEFORE_BUILD runs inside cibuildwheel's
      # build environment, so we must use an absolute path (not relative).
      # ──────────────────────────────────────────────────────────────────────
      - name: Build pydantic-core for Android
        working-directory: pydantic-core
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
          # CRITICAL FIX: Use absolute path with github.workspace.
          # Relative paths break because cibuildwheel copies source to a temp dir.
          CIBW_BEFORE_BUILD: "pip install --no-index --find-links ${{ github.workspace }}/wheels jiter"
        run: |
          cibuildwheel --output-dir "${{ github.workspace }}/wheels"

      - name: List all built wheels
        run: |
          echo "📦 All built wheels:"
          ls -la "${{ github.workspace }}/wheels/"

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-wheels
          path: ${{ github.workspace }}/wheels/*.whl

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          files: ${{ github.workspace }}/wheels/*.whl
          body: |
            Prebuilt Android wheels for pydantic-core and jiter.
            **Python:** 3.13 | **ABIs:** arm64-v8a, x86_64
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}