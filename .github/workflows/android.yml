name: Android Dev Client APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /usr/share/php* /usr/share/mysql* \
            /usr/local/share/powershell /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-

      # ──────────────────────────────────────────────────────────────────────
      # FIXED: Install dependencies with ignore-engines
      # ──────────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          # Clean start
          rm -rf node_modules package-lock.json
          # Install with legacy peer deps and ignore engines
          npm install --legacy-peer-deps --ignore-engines
          # Generate fresh lockfile
          npm install --package-lock-only --legacy-peer-deps --ignore-engines

      - name: Decode .env file
        if: github.event.inputs.build_type == 'release'
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
          echo "✅ .env file created"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> android/local.properties

      - name: Decode release keystore
        if: github.event.inputs.build_type == 'release'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > android/app/release.keystore
          echo "✅ Release keystore created"

      - name: Create keystore.properties
        if: github.event.inputs.build_type == 'release'
        run: |
          cat > android/keystore.properties << EOF
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          echo "✅ keystore.properties created"

      - name: Generate debug keystore
        if: github.event.inputs.build_type == 'debug'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download ffmpeg-kit AAR
        run: |
          mkdir -p android/libs
          curl -L "https://github.com/NooruddinLakhani/ffmpeg-kit-full-gpl/releases/download/v1.0.0/ffmpeg-kit-full-gpl.aar" \
            -o android/libs/ffmpeg-kit-full-gpl.aar
          echo "AAR downloaded: $(du -sh android/libs/ffmpeg-kit-full-gpl.aar)"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            ./gradlew assembleRelease --no-daemon --build-cache --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --build-cache --stacktrace
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type == 'release' && 'release' || 'debug' }}-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/${{ github.event.inputs.build_type == 'release' && 'release' || 'debug' }}/*.apk
          retention-days: 14