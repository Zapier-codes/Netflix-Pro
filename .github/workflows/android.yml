name: Android Dev Client APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /usr/share/php* /usr/share/mysql* \
            /usr/local/share/powershell /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Checkout (without LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'modules/**/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Decode .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
          echo "✅ .env file created"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: android-sdk-${{ runner.os }}-platform36-buildtools36.0.0-ndk27.1.12297006

      - name: Install SDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set NDK env vars
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> android/local.properties

      # ──────────────────────────────────────────────────────────────────────
      # pydantic-core and jiter have no prebuilt Android wheel in Chaquopy's
      # own package repository, so they're cross-compiled separately by the
      # build-android-wheels.yml workflow (via cibuildwheel) and published
      # as a GitHub Release. This step downloads those .whl files into the
      # boxoffice module's wheels/ directory, where build.gradle's
      # `options("--find-links", ...)` line tells pip to look for them.
      # Pin ANDROID_WHEELS_TAG to whatever release tag build-android-wheels.yml published.
      # ──────────────────────────────────────────────────────────────────────
      - name: Download prebuilt Android wheels (pydantic-core, jiter)
        env:
          ANDROID_WHEELS_TAG: android-wheels-v1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEELS_DIR="modules/boxoffice/android/src/main/python/wheels"
          mkdir -p "$WHEELS_DIR"
          
          gh release download "$ANDROID_WHEELS_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --dir "$WHEELS_DIR" \
            --clobber
          
          echo "✅ Android wheels downloaded:"
          ls -la "$WHEELS_DIR"

      # ──────────────────────────────────────────────────────────────────────
      # Cache Chaquopy Python packages. The cache key includes the
      # requirements.txt hash AND the wheels directory contents, so it
      # invalidates whenever either the Python deps or the prebuilt wheels
      # change.
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache Chaquopy Python packages
        id: chaquopy-cache
        uses: actions/cache@v4
        with:
          path: |
            modules/boxoffice/android/build/python
            modules/boxoffice/android/build/chaquopy
          key: chaquopy-${{ runner.os }}-${{ hashFiles('modules/boxoffice/android/src/main/python/requirements.txt', 'modules/boxoffice/android/src/main/python/wheels/*.whl') }}

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache ffmpeg-kit AAR
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: android/libs/ffmpeg-kit-full-gpl.aar
          key: ffmpeg-kit-aar-v1.0.0

      - name: Download ffmpeg-kit AAR
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/libs
          curl -L "https://github.com/NooruddinLakhani/ffmpeg-kit-full-gpl/releases/download/v1.0.0/ffmpeg-kit-full-gpl.aar" \
            -o android/libs/ffmpeg-kit-full-gpl.aar
          echo "AAR downloaded: $(du -sh android/libs/ffmpeg-kit-full-gpl.aar)"

      - name: Set Chaquopy env vars
        run: |
          echo "CHAQUOPY_PYTHON_VERSION=3.13" >> $GITHUB_ENV
          echo "CHAQUOPY_NO_LICENSE=DIALOG" >> $GITHUB_ENV

      - name: Mirror pawns-sdk local AARs into android/libs
        run: |
          mkdir -p android/libs
          cp modules/pawns/android/libs/internet-sharing-1.8.1.aar android/libs/
          cp modules/pawns/android/libs/pawns-ndk-1.8.1.aar android/libs/
          echo "✅ pawns-sdk AARs mirrored into android/libs"
          ls -la android/libs

      - name: Verify boxoffice module
        run: |
          echo "Checking boxoffice module structure..."
          test -f modules/boxoffice/android/build.gradle || { echo "❌ missing build.gradle"; exit 1; }
          test -f modules/boxoffice/android/src/main/python/requirements.txt || { echo "❌ missing requirements.txt"; exit 1; }
          test -f modules/boxoffice/expo-module.config.json || { echo "❌ missing expo-module.config.json"; exit 1; }
          
          WHEELS_DIR="modules/boxoffice/android/src/main/python/wheels"
          test -n "$(ls -A $WHEELS_DIR/*.whl 2>/dev/null)" || { echo "❌ no prebuilt Android wheels found"; exit 1; }
          
          echo "✅ boxoffice module structure valid"
          echo "📦 Wheels found:"
          ls -la "$WHEELS_DIR"
          
          # Verify wheel tags match Chaquopy's Python version (3.13)
          for whl in "$WHEELS_DIR"/*.whl; do
            name=$(basename "$whl")
            if [[ "$name" == *cp313* ]]; then
              echo "  ✅ $name — Python 3.13 compatible"
            elif [[ "$name" == *cp312* ]]; then
              echo "  ❌ $name — Python 3.12 wheel, MISMATCH with Chaquopy 3.13!"
              exit 1
            else
              echo "  ⚠️  $name — Unknown Python version"
            fi
          done
          
          cat modules/boxoffice/android/src/main/python/requirements.txt

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon --build-cache --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,x86_64
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CHAQUOPY_PYTHON_VERSION: ${{ env.CHAQUOPY_PYTHON_VERSION }}
          CHAQUOPY_NO_LICENSE: ${{ env.CHAQUOPY_NO_LICENSE }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14