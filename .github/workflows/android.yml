name: Android Dev Client APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /usr/share/php* /usr/share/mysql* \
            /usr/local/share/powershell /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Checkout (without LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'modules/**/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      # ──────────────────────────────────────────────────────────────────────
      # node_modules is keyed strictly on package-lock.json's hash. If the
      # lockfile hasn't changed since the last successful run, this restores
      # a full cache hit and the install step below is skipped entirely —
      # no re-resolving. If the lockfile changed (a dependency was added,
      # removed, or bumped), the key changes, cache-hit is false, npm ci
      # installs fresh, and actions/cache automatically saves node_modules
      # under the NEW key at the end of the job — so next run hits the cache
      # again with the updated dependency already baked in.
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ──────────────────────────────────────────────────────────────────────
      # Only runs on a cache miss (lockfile changed or first run ever).
      # npm ci installs exactly what's in package-lock.json — no resolution,
      # no lockfile regeneration, no silent version drift. Commit an
      # up-to-date package-lock.json for this to work; if package.json and
      # package-lock.json are out of sync, npm ci fails loudly instead of
      # quietly re-resolving, which is what we want in CI.
      # ──────────────────────────────────────────────────────────────────────
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # ──────────────────────────────────────────────────────────────────────
      # Needed so EXPO_PUBLIC_* vars get inlined into the JS bundle at
      # build time. ENV_FILE secret should be your full .env, base64-encoded.
      # ──────────────────────────────────────────────────────────────────────
      - name: Decode .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
          echo "✅ .env file created"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ──────────────────────────────────────────────────────────────────────
      # SDK components are pinned to exact versions below, so the cache key
      # doesn't need to hash anything — it only needs to change when those
      # pinned versions change. On a hit, the platform/build-tools/ndk
      # folders are restored straight into ANDROID_SDK_ROOT and the install
      # step is skipped entirely, saving the sdkmanager download+unpack.
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache Android SDK components
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: android-sdk-${{ runner.os }}-platform34-buildtools34.0.0-ndk27.1.12297006

      - name: Install SDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006"

      # ──────────────────────────────────────────────────────────────────────
      # These env vars are needed by later steps regardless of whether the
      # SDK components were just installed or restored from cache, so they
      # stay outside the conditional install step above.
      # ──────────────────────────────────────────────────────────────────────
      - name: Set NDK env vars
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> android/local.properties

      # ──────────────────────────────────────────────────────────────────────
      # Cache Chaquopy Python packages to avoid re-downloading moviebox-api
      # and its dependencies on every build. The cache key includes the
      # requirements.txt hash so it invalidates when Python deps change.
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache Chaquopy Python packages
        id: chaquopy-cache
        uses: actions/cache@v4
        with:
          path: |
            modules/boxoffice/android/build/python
            modules/boxoffice/android/build/chaquopy
          key: chaquopy-${{ runner.os }}-${{ hashFiles('modules/boxoffice/android/src/main/python/requirements.txt') }}

      # ──────────────────────────────────────────────────────────────────────
      # Debug-only workflow, always generates a fresh debug keystore so
      # :app:validateSigningDebug has a file to find. Unconditional now —
      # no build_type branching to fall through on push events.
      # ──────────────────────────────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ──────────────────────────────────────────────────────────────────────
      # The AAR is pinned to release v1.0.0 in the URL below, so the cache
      # key is static — it only needs to change if that version bumps.
      # On a hit, the ~100MB+ download is skipped entirely.
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache ffmpeg-kit AAR
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: android/libs/ffmpeg-kit-full-gpl.aar
          key: ffmpeg-kit-aar-v1.0.0

      - name: Download ffmpeg-kit AAR
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/libs
          curl -L "https://github.com/NooruddinLakhani/ffmpeg-kit-full-gpl/releases/download/v1.0.0/ffmpeg-kit-full-gpl.aar" \
            -o android/libs/ffmpeg-kit-full-gpl.aar
          echo "AAR downloaded: $(du -sh android/libs/ffmpeg-kit-full-gpl.aar)"

      # ──────────────────────────────────────────────────────────────────────
      # These env vars tell Chaquopy where to find the Python interpreter
      # and ensure the boxoffice module's Python code is built into the APK.
      # CHAQUOPY_PYTHON_VERSION pins the Python version for reproducible builds.
      # ──────────────────────────────────────────────────────────────────────
      - name: Set Chaquopy env vars
        run: |
          echo "CHAQUOPY_PYTHON_VERSION=3.12" >> $GITHUB_ENV
          echo "CHAQUOPY_NO_LICENSE=DIALOG" >> $GITHUB_ENV

      # ──────────────────────────────────────────────────────────────────────
      # Gradle repositories are scoped per-project: when :app resolves its
      # own dependency graph, it only searches repositories it (or a root
      # allprojects block) declared — not repositories declared inside
      # pawns-sdk's own build.gradle. :app's flatDir repo already points at
      # android/libs (that's where it successfully finds ffmpeg-kit's AAR
      # above), so pawns-sdk's local AARs need to land in that same folder
      # for :app:debugRuntimeClasspath to resolve them. This mirrors them
      # in without touching any build.gradle beyond the pawns-sdk flatDir
      # fix already made.
      # ──────────────────────────────────────────────────────────────────────
      - name: Mirror pawns-sdk local AARs into android/libs
        run: |
          mkdir -p android/libs
          cp modules/pawns/android/libs/internet-sharing-1.8.1.aar android/libs/
          cp modules/pawns/android/libs/pawns-ndk-1.8.1.aar android/libs/
          echo "✅ pawns-sdk AARs mirrored into android/libs"
          ls -la android/libs

      # ──────────────────────────────────────────────────────────────────────
      # Verify boxoffice module structure before build to catch missing
      # files early instead of failing deep in the Gradle build.
      # ──────────────────────────────────────────────────────────────────────
      - name: Verify boxoffice module
        run: |
          echo "Checking boxoffice module structure..."
          test -f modules/boxoffice/android/build.gradle || { echo "❌ missing build.gradle"; exit 1; }
          test -f modules/boxoffice/android/src/main/python/requirements.txt || { echo "❌ missing requirements.txt"; exit 1; }
          test -f modules/boxoffice/expo-module.config.json || { echo "❌ missing expo-module.config.json"; exit 1; }
          echo "✅ boxoffice module structure valid"
          cat modules/boxoffice/android/src/main/python/requirements.txt

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --build-cache --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CHAQUOPY_PYTHON_VERSION: ${{ env.CHAQUOPY_PYTHON_VERSION }}
          CHAQUOPY_NO_LICENSE: ${{ env.CHAQUOPY_NO_LICENSE }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14