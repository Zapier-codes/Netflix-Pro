// modules/boxoffice/android/build.gradle

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.chaquo.python'

group = 'expo.modules.boxoffice'
version = '1.0.0'

def expoModulesCoreVersion = "55.0.25"
def nitroModulesVersion = "0.36.1"
def chaquopyVersion = "15.0.1"

android {
    namespace "expo.modules.boxoffice"
    compileSdk 36   // bumped to match project-wide compileSdk

    defaultConfig {
        minSdk 24
        targetSdk 36   // bumped to match project-wide targetSdk
        versionCode 1
        versionName "1.0.0"

        python {
            version "3.12"
            buildPython "python3"
            pip {
                install "-r", "src/main/python/requirements.txt"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://chaquo.com/maven" }
    maven { url "$rootDir/../node_modules/react-native/android" }
    maven { url "$rootDir/../node_modules/expo-modules-core/android/maven" }
    maven { url "$rootDir/../node_modules/react-native-nitro-modules/android" }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "expo.modules:expo-modules-core:$expoModulesCoreVersion"
    implementation "com.facebook.react:react-native:0.83.6"
    implementation "com.margelo.nitro:react-native-nitro-modules:$nitroModulesVersion"
    implementation "com.chaquo.python:runtime:$chaquopyVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.json:json:20231013"
}