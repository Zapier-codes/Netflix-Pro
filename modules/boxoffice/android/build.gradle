plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

group = 'expo.modules.boxoffice'
version = '1.0.0'

android {
    namespace "expo.modules.boxoffice"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }
}

// NEW DSL (Chaquopy 15+): top-level chaquopy block
chaquopy {
    defaultConfig {
        version = "3.13"

        pip {
            // Absolute path to prebuilt wheels directory
            options("--find-links", file("src/main/python/wheels").absolutePath)
            // Force binary-only for packages we have wheels for
            options("--only-binary", "pydantic-core,jiter")

            install("pydantic-core==2.33.2")
            install("pydantic==2.11.7")
            install("moviebox-api==0.5.5")
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation project(':react-native-nitro-modules')
    implementation "com.facebook.react:react-native:0.83.6"
}