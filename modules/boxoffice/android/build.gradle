// modules/boxoffice/android/build.gradle

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.chaquo.python'

group = 'expo.modules.boxoffice'
version = '1.0.0'

def expoModulesCoreVersion = "55.0.25"
def nitroModulesVersion = "0.36.1"
def chaquopyVersion = "16.0.0"  // Update to latest

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
        // Chaquopy plugin is applied via plugins DSL or apply plugin above
    }
}

android {
    namespace "expo.modules.boxoffice"
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }

    // Chaquopy Python configuration - MOVED OUT of defaultConfig
    python {
        version "3.12"
        buildPython "python3"
        pip {
            install "-r", "src/main/python/requirements.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://chaquo.com/maven" }
    maven { url "$rootDir/../node_modules/react-native/android" }
    maven { url "$rootDir/../node_modules/expo-modules-core/android/maven" }
    maven { url "$rootDir/../node_modules/react-native-nitro-modules/android" }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "expo.modules:expo-modules-core:$expoModulesCoreVersion"
    implementation "com.facebook.react:react-native:0.83.6"
    implementation "com.margelo.nitro:react-native-nitro-modules:$nitroModulesVersion"
    implementation "com.chaquo.python:runtime:$chaquopyVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.json:json:20231013"
}