apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.chaquo.python'

group = 'expo.modules.boxoffice'
version = '1.0.0'

android {
    namespace "expo.modules.boxoffice"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            version "3.12"
            pip {
                install "-r", "src/main/python/requirements.txt"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }
}

dependencies {
    implementation "expo.modules:expo-modules-core:55.0.25"
    implementation "com.facebook.react:react-native:0.83.6"
    implementation "com.margelo.nitro:react-native-nitro-modules:0.36.1"
    implementation "com.chaquo.python:runtime:17.0.0"
}